<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" width="340" height="64" fill="none">
  <!-- Brand Icon: Geometric Interlocking Bricks Structure (White / Terracotta) -->
  <g transform="translate(4, 4)">
    <!-- Base Layer Bricks (White/Sand) -->
    <rect x="0" y="38" width="24" height="14" rx="2.5" fill="#FFFFFF"/>
    <rect x="28" y="38" width="24" height="14" rx="2.5" fill="#FAF8F5" fill-opacity="0.8"/>
    
    <!-- Mid Layer Offset Bricks (Terracotta Red) -->
    <rect x="14" y="20" width="24" height="14" rx="2.5" fill="#E07A5F"/>
    <rect x="42" y="20" width="10" height="14" rx="2" fill="#FAF8F5" fill-opacity="0.6"/>
    
    <!-- Top Layer Brick (Terracotta Accent) -->
    <rect x="0" y="2" width="24" height="14" rx="2.5" fill="#E07A5F"/>
    <rect x="28" y="2" width="10" height="14" rx="2" fill="#FFFFFF"/>
    
    <!-- Dynamic Corner Accent Dot -->
    <circle cx="50" cy="7" r="3.5" fill="#E07A5F"/>
  </g>

  <!-- Typography -->
  <text x="74" y="32" font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif" font-size="25" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">
    SSN<tspan fill="#E07A5F">.</tspan>
  </text>
  <text x="135" y="32" font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" font-weight="700" letter-spacing="1" fill="#FFFFFF">
    CONSTRUCTIONS
  </text>
  <text x="75" y="49" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" letter-spacing="2.2" fill="#94A3B8">
    KARIMNAGAR RED BRICKS &bull; HYDERABAD
  </text>
</svg>
